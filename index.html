<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Placar do Futebol - Resultados ao vivo</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>⚽ Placar do Futebol</h1>

<p>Resultados ao vivo dos jogos de hoje</p>

</header>


<main class="container">


<h2>🔥 Jogos de Hoje</h2>



<div id="jogos-container"></div>






</main>


<footer>


<div class="footer-links">
<a href="#">Sobre</a>
<a href="#">Política de Privacidade</a>

  <a href="mailto:placardofutebol.com@gmail.com">Contato</a>
</div>

<p>© 2026 placardofutebol.com</p>

</footer>

<script>
async function carregarJogos() {

  const hoje = new Date().toISOString().split("T")[0];

  const resposta = await fetch(
    `https://v3.football.api-sports.io/fixtures?date=${hoje}`,
    {
      method: "GET",
      headers: {
        "x-apisports-key": "5b6f884a4ce7c11a2c67cf54de3f4a73"
      }
    }
  );

  const dados = await resposta.json();

  const container = document.getElementById("jogos-container");

  container.innerHTML = "";

  dados.response.forEach(jogo => {

    container.innerHTML += `
      <div class="jogo-card">

        <div class="liga">
          ${jogo.league.name}
        </div>

        <div class="jogo-info">

          <div class="tempo">
            ${jogo.fixture.status.short}
          </div>

          <div class="times">

            <div class="time">
              ${jogo.teams.home.name}
            </div>

            <div class="placar">
              ${jogo.goals.home ?? 0} x ${jogo.goals.away ?? 0}
            </div>

            <div class="time">
              ${jogo.teams.away.name}
            </div>

          </div>

        </div>

      </div>
    `;

  });

}

carregarJogos();
</script>
</body>

</html>
