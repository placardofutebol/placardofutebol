<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a7a30">
  <meta name="robots" content="noindex">
  <title>Sem conexão - Placar do Futebol</title>
  <style>
    :root {
      --fundo: #12151e;
      --texto: #ffffff;
      --suave: #9aa3b2;
      --verde: #1a7a30;
      --verde-escuro: #165a24;
      --destaque: #f5c518;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; width: 100%; }
    .marca { font-size: 15px; font-weight: 800; letter-spacing: .02em; margin-bottom: 28px; }
    .marca span { color: var(--destaque); }
    h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px; }
    p { margin: 0 0 28px; color: var(--suave); font-size: 16px; line-height: 1.5; }
    button {
      width: 100%;
      padding: 14px 24px;
      border: 0;
      border-radius: 10px;
      background: var(--verde);
      color: var(--texto);
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { background: var(--verde-escuro); }
    button:focus-visible { outline: 3px solid var(--destaque); outline-offset: 3px; }
  </style>
</head>
<body>
  <main role="main">
    <div class="marca">PLACAR <span>DO FUTEBOL</span></div>
    <h1>Não foi possível carregar esta página</h1>
    <p>Verifique sua conexão com a internet e tente de novo. Quando a conexão voltar, o placar recarrega sozinho.</p>
    <button type="button" onclick="location.href='/'">Tentar de novo</button>
  </main>
  <script>
    window.addEventListener('online', function () { location.href = '/'; });
  </script>
</body>
</html>
