<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seleções da Copa do Mundo 2026 | Placar do Futebol</title>
  <meta name="description" content="Conheça todas as 48 seleções da Copa do Mundo 2026. Estatísticas, jogadores e muito mais."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-deep:   #0a4a2a;
      --green-mid:    #1a7a45;
      --green-bright: #22c55e;
      --gold:         #f5c518;
      --gold-dark:    #c9a012;
      --white:        #f8fafc;
      --gray-light:   #e2e8f0;
      --gray-mid:     #94a3b8;
      --dark:         #0f1923;
      --card-bg:      #152b1e;
      --card-border:  #1f4a2f;
    }

    body {
      background: var(--dark);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(160deg, var(--green-deep) 0%, #0d1f10 60%, var(--dark) 100%);
      padding: 48px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(34,197,94,.12) 0%, transparent 55%),
        radial-gradient(circle at 80% 30%, rgba(245,197,24,.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--dark);
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 2px;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(28px, 6vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: .02em;
      color: var(--white);
      margin-bottom: 10px;
    }
    .hero h1 span { color: var(--green-bright); }
    .hero p {
      font-size: 15px;
      color: var(--gray-mid);
      max-width: 460px;
      margin: 0 auto;
    }

    /* ── GROUPS NAV ── */
    .groups-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 28px 16px 0;
    }
    .group-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--gray-mid);
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
    }
    .group-btn:hover,
    .group-btn.active {
      background: var(--green-mid);
      border-color: var(--green-bright);
      color: var(--white);
    }

    /* ── MAIN ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    /* ── GROUP SECTION ── */
    .group-section {
      margin-bottom: 40px;
    }
    .group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .group-label {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: .04em;
    }
    .group-divider {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--card-border), transparent);
    }

    /* ── TEAM GRID ── */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    /* ── TEAM CARD ── */
    .team-card {
      display: block;
      text-decoration: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px 10px 14px;
      text-align: center;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      cursor: pointer;
    }
    .team-card:hover {
      transform: translateY(-4px);
      border-color: var(--green-bright);
      box-shadow: 0 8px 24px rgba(34,197,94,.18);
    }
    .team-card:hover .flag-emoji { transform: scale(1.12); }

    .flag-emoji {
      font-size: 44px;
      line-height: 1;
      display: block;
      margin-bottom: 10px;
      transition: transform .2s;
    }
    .team-name {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: .04em;
      line-height: 1.3;
      text-transform: uppercase;
    }
    .team-conf {
      font-size: 10px;
      color: var(--gray-mid);
      margin-top: 4px;
      letter-spacing: .04em;
    }

    /* highlight Brazil */
    .team-card.brazil {
      border-color: var(--gold-dark);
      background: linear-gradient(160deg, #1a2e0a 0%, var(--card-bg) 100%);
    }
    .team-card.brazil:hover {
      border-color: var(--gold);
      box-shadow: 0 8px 24px rgba(245,197,24,.22);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 24px 16px;
      border-top: 1px solid var(--card-border);
      color: var(--gray-mid);
      font-size: 12px;
    }
    footer a { color: var(--green-bright); text-decoration: none; }

    @media (max-width: 480px) {
      .team-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .flag-emoji { font-size: 36px; }
      .team-name { font-size: 11px; }
    }
  </style>
</head>
<body>

<!-- HERO -->
<header class="hero">
  <div class="hero-badge">Copa do Mundo 2026</div>
  <h1>As <span>48 Seleções</span><br>do Mundial</h1>
  <p>Clique em uma seleção para ver elenco, estatísticas e muito mais.</p>
</header>

<!-- GRUPOS NAV -->
<nav class="groups-nav" id="groupsNav">
  <button class="group-btn active" onclick="filterGroup('all', this)">Todas</button>
  <button class="group-btn" onclick="filterGroup('A', this)">Grupo A</button>
  <button class="group-btn" onclick="filterGroup('B', this)">Grupo B</button>
  <button class="group-btn" onclick="filterGroup('C', this)">Grupo C</button>
  <button class="group-btn" onclick="filterGroup('D', this)">Grupo D</button>
  <button class="group-btn" onclick="filterGroup('E', this)">Grupo E</button>
  <button class="group-btn" onclick="filterGroup('F', this)">Grupo F</button>
  <button class="group-btn" onclick="filterGroup('G', this)">Grupo G</button>
  <button class="group-btn" onclick="filterGroup('H', this)">Grupo H</button>
  <button class="group-btn" onclick="filterGroup('I', this)">Grupo I</button>
  <button class="group-btn" onclick="filterGroup('J', this)">Grupo J</button>
  <button class="group-btn" onclick="filterGroup('K', this)">Grupo K</button>
  <button class="group-btn" onclick="filterGroup('L', this)">Grupo L</button>
</nav>

<!-- MAIN CONTENT -->
<main id="mainContent"></main>

<footer>
  <p>© 2026 <a href="/">Placar do Futebol</a> · Todos os direitos reservados</p>
</footer>

<script>
const GROUPS = {
  A: [
    { name: "Estados Unidos", flag: "🇺🇸", conf: "CONCACAF", slug: "estados-unidos" },
    { name: "Jamaica",        flag: "🇯🇲", conf: "CONCACAF", slug: "jamaica" },
    { name: "Panamá",         flag: "🇵🇦", conf: "CONCACAF", slug: "panama" },
    { name: "Marrocos",       flag: "🇲🇦", conf: "CAF",      slug: "marrocos" },
  ],
  B: [
    { name: "Argentina",      flag: "🇦🇷", conf: "CONMEBOL", slug: "argentina" },
    { name: "Chile",          flag: "🇨🇱", conf: "CONMEBOL", slug: "chile" },
    { name: "Peru",           flag: "🇵🇪", conf: "CONMEBOL", slug: "peru" },
    { name: "Austrália",      flag: "🇦🇺", conf: "AFC",      slug: "australia" },
  ],
  C: [
    { name: "México",         flag: "🇲🇽", conf: "CONCACAF", slug: "mexico" },
    { name: "Equador",        flag: "🇪🇨", conf: "CONMEBOL", slug: "equador" },
    { name: "Nova Zelândia",  flag: "🇳🇿", conf: "OFC",      slug: "nova-zelandia" },
    { name: "Nigéria",        flag: "🇳🇬", conf: "CAF",      slug: "nigeria" },
  ],
  D: [
    { name: "Canadá",         flag: "🇨🇦", conf: "CONCACAF", slug: "canada" },
    { name: "Uruguai",        flag: "🇺🇾", conf: "CONMEBOL", slug: "uruguai" },
    { name: "Costa Rica",     flag: "🇨🇷", conf: "CONCACAF", slug: "costa-rica" },
    { name: "Senegal",        flag: "🇸🇳", conf: "CAF",      slug: "senegal" },
  ],
  E: [
    { name: "Espanha",        flag: "🇪🇸", conf: "UEFA",     slug: "espanha" },
    { name: "Alemanha",       flag: "🇩🇪", conf: "UEFA",     slug: "alemanha" },
    { name: "Japão",          flag: "🇯🇵", conf: "AFC",      slug: "japao" },
    { name: "Serra Leoa",     flag: "🇸🇱", conf: "CAF",      slug: "serra-leoa" },
  ],
  F: [
    { name: "França",         flag: "🇫🇷", conf: "UEFA",     slug: "franca" },
    { name: "Polônia",        flag: "🇵🇱", conf: "UEFA",     slug: "polonia" },
    { name: "Arábia Saudita", flag: "🇸🇦", conf: "AFC",      slug: "arabia-saudita" },
    { name: "Camarões",       flag: "🇨🇲", conf: "CAF",      slug: "camaroes" },
  ],
  G: [
    { name: "Portugal",       flag: "🇵🇹", conf: "UEFA",     slug: "portugal" },
    { name: "Croácia",        flag: "🇭🇷", conf: "UEFA",     slug: "croacia" },
    { name: "Honduras",       flag: "🇭🇳", conf: "CONCACAF", slug: "honduras" },
    { name: "Tanzânia",       flag: "🇹🇿", conf: "CAF",      slug: "tanzania" },
  ],
  H: [
    { name: "Brasil",         flag: "🇧🇷", conf: "CONMEBOL", slug: "brasil",    highlight: true },
    { name: "Haiti",          flag: "🇭🇹", conf: "CONCACAF", slug: "haiti" },
    { name: "Escócia",        flag: "🏴󠁧󠁢󠁳󠁣󠁴󠁿", conf: "UEFA",     slug: "escocia" },
    { name: "Gabão",          flag: "🇬🇦", conf: "CAF",      slug: "gabao" },
  ],
  I: [
    { name: "Inglaterra",     flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", conf: "UEFA",     slug: "inglaterra" },
    { name: "Irã",            flag: "🇮🇷", conf: "AFC",      slug: "ira" },
    { name: "Trinidad",       flag: "🇹🇹", conf: "CONCACAF", slug: "trinidad" },
    { name: "Tunísia",        flag: "🇹🇳", conf: "CAF",      slug: "tunisia" },
  ],
  J: [
    { name: "Países Baixos",  flag: "🇳🇱", conf: "UEFA",     slug: "paises-baixos" },
    { name: "Sérvia",         flag: "🇷🇸", conf: "UEFA",     slug: "servia" },
    { name: "Coreia do Sul",  flag: "🇰🇷", conf: "AFC",      slug: "coreia-do-sul" },
    { name: "Rep. Dom.",      flag: "🇩🇴", conf: "CONCACAF", slug: "republica-dominicana" },
  ],
  K: [
    { name: "Bélgica",        flag: "🇧🇪", conf: "UEFA",     slug: "belgica" },
    { name: "Itália",         flag: "🇮🇹", conf: "UEFA",     slug: "italia" },
    { name: "Suíça",          flag: "🇨🇭", conf: "UEFA",     slug: "suica" },
    { name: "Colômbia",       flag: "🇨🇴", conf: "CONMEBOL", slug: "colombia" },
  ],
  L: [
    { name: "Venezuela",      flag: "🇻🇪", conf: "CONMEBOL", slug: "venezuela" },
    { name: "Bolívia",        flag: "🇧🇴", conf: "CONMEBOL", slug: "bolivia" },
    { name: "Turquia",        flag: "🇹🇷", conf: "UEFA",     slug: "turquia" },
    { name: "Cazaquistão",    flag: "🇰🇿", conf: "UEFA",     slug: "cazaquistao" },
  ],
};

function buildHTML(filter) {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  const groupsToShow = filter === 'all'
    ? Object.keys(GROUPS)
    : [filter];

  groupsToShow.forEach(g => {
    const section = document.createElement('section');
    section.className = 'group-section';
    section.dataset.group = g;

    const header = document.createElement('div');
    header.className = 'group-header';
    header.innerHTML = `<span class="group-label">GRUPO ${g}</span><div class="group-divider"></div>`;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'team-grid';

    GROUPS[g].forEach(team => {
      const card = document.createElement('a');
      card.className = 'team-card' + (team.highlight ? ' brazil' : '');
      card.href = `${team.slug}/index.html`;
      card.innerHTML = `
        <span class="flag-emoji">${team.flag}</span>
        <div class="team-name">${team.name}</div>
        <div class="team-conf">${team.conf}</div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    main.appendChild(section);
  });
}

function filterGroup(group, btn) {
  document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildHTML(group);
}

// Init
buildHTML('all');
</script>
</body>
</html>
